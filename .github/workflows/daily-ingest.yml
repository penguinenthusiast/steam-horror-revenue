name: Daily ingest

on:
  schedule:
    # 06:00 UTC — after typical SteamSpy daily refresh
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run ingest
        run: python scripts/run_ingest.py --no-cache
      - name: Upload database
        uses: actions/upload-artifact@v4
        with:
          name: horror-index-db
          path: data/horror_index.sqlite3
